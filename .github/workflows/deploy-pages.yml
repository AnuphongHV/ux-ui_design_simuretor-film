name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/uxui-responsive-demo-i3mcnu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละครั้ง และไม่ยกเลิกตัวที่กำลังรันอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true จะเปิด GitHub Pages ให้อัตโนมัติถ้ายังไม่ได้เปิด
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # เว็บเป็น static ล้วน ไม่ต้อง build อัปโหลดทั้งโฟลเดอร์ได้เลย
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
